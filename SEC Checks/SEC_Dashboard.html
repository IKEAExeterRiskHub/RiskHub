<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEC Checks</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    /* IKEA Branding */
    .header {
        background-color: #0058A3;
        color: white;
        padding: 20px;
        text-align: center;
        border-bottom: 8px solid #FFDA1A;
    }

    .header h1 {
        margin: 0;
        font-size: 32px;
    }

    .container {
        max-width: 1200px;
        margin: 40px auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .card {
        background: white;
        border-radius: 10px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: transform 0.2s ease;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    .card h3 {
        color: #0058A3;
        margin-bottom: 15px;
    }

    .btn {
        background-color: #FFDA1A;
        color: #000;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 5px;
        font-weight: bold;
        display: inline-block;
    }

    .btn:hover {
        background-color: #f0c800;
    }
</style>
</head>

<body>

<div class="header">
    <h1>SEC Checks</h1>
</div>

<div class="container">

    <button class="btn" onclick="window.location.href='IFS/coworker.html'">
        IFS Check 
    </button>

    <button class="btn" onclick="window.location.href='Showrooms/living.html'">
        Showrooms Check 
    </button>

    <button class="btn" onclick="window.location.href='Markethall/cook.html'">
        Markethall Check 
    </button>

    <button class="btn" onclick="window.location.href='SelfServe & Recovery/self.html'">
        SelfServe & Recovery 
    </button>

    <button class="btn" onclick="window.location.href='Fullserve & Loading Bay/goods.html'">
        FullServe & Loading Bay 
    </button>

</div>

</body>
</html>
