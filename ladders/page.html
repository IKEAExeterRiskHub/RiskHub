<script>

const TOTAL_PAGES = 40;

function updateProgress() {

    const completed =
        JSON.parse(
            localStorage.getItem("completedAuditPages")
        ) || [];

    const count = completed.length;

    const percentage =
        Math.round((count / TOTAL_PAGES) * 100);

    document.getElementById("auditProgress").value =
        percentage;

    document.getElementById("progressText").textContent =
        `${count}/${TOTAL_PAGES} Audits Complete (${percentage}%)`;

    const printBtn =
        document.getElementById("printBtn");

    if (count === TOTAL_PAGES) {

        printBtn.disabled = false;
        printBtn.style.background = "#28a745";
        printBtn.style.color = "#ffffff";

    } else {

        printBtn.disabled = true;
        printBtn.style.background = "#FFDA1A";
        printBtn.style.color = "#0058A3";
    }

    updateLevelButtons();
}

function updateLevelButtons() {

    const completed =
        JSON.parse(
            localStorage.getItem("completedAuditPages")
        ) || [];

    function setButtonColour(level) {

        const btn =
            document.getElementById(`level${level}Btn`);

        if (!btn) return;

        if (
            completed.includes(String(level)) ||
            completed.includes(level)
        ) {

            btn.style.background = "#28a745";
            btn.style.color = "#ffffff";

        } else {

            btn.style.background = "#FFDA1A";
            btn.style.color = "#0058A3";
        }
    }

    for (let i = 1; i <= 40; i++) {
    setButtonColour(i);
}
}
function buildChecksTable(data){

    if(
        !data ||
        !data.checks ||
        !data.checks.length
    ){
        return "<p>No audit data recorded.</p>";
    }

    return `
        <table style="width:100%;border-collapse:collapse;">
            <tr>
                <th style="border:1px solid #ccc;padding:8px;background:#FFDA1A;color:#0058A3;">Question</th>
                <th style="border:1px solid #ccc;padding:8px;background:#FFDA1A;color:#0058A3;">Result</th>
            </tr>
            ${data.checks.map(c => `
                <tr>
                    <td style="border:1px solid #ccc;padding:8px;">
                        ${c.question || ""}
                    </td>
                    <td style="border:1px solid #ccc;padding:8px;">
                        ${c.result || ""}
                    </td>
                </tr>
            `).join("")}
        </table>
    `;
}

/* Signature Pad */

const canvas =
    document.getElementById("signaturePad");

const ctx =
    canvas.getContext("2d");

let drawing = false;

function getPosition(e){

    const rect =
        canvas.getBoundingClientRect();

    if(e.touches){

        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        };
    }

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

function startDrawing(e){

    drawing = true;

    const pos = getPosition(e);

    ctx.beginPath();
    ctx.moveTo(pos.x,pos.y);
}

function draw(e){

    if(!drawing) return;

    e.preventDefault();

    const pos = getPosition(e);

    ctx.lineWidth = 2;
    ctx.lineCap = "round";

    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();
}

function stopDrawing(){
    drawing=false;
}

canvas.addEventListener("mousedown",startDrawing);
canvas.addEventListener("mousemove",draw);
canvas.addEventListener("mouseup",stopDrawing);
canvas.addEventListener("mouseleave",stopDrawing);

canvas.addEventListener("touchstart",startDrawing);
canvas.addEventListener("touchmove",draw);
canvas.addEventListener("touchend",stopDrawing);

function clearSignature(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

                (questionLines.length * 5) + 2
            );

        if (y + rowHeight > 270) {
            pdf.addPage();
            y = 20;
        }

        pdf.setDrawColor(220);

        pdf.rect(10, y - 4, 145, rowHeight);
        pdf.rect(155, y - 4, 40, rowHeight);

        pdf.setTextColor(0);
        pdf.setFont(undefined, "normal");

        pdf.text(
            questionLines,
            13,
            y
        );

        if (check.result === "YES") {
            pdf.setTextColor(0, 140, 0);
        } else {
            pdf.setTextColor(200, 0, 0);
        }

        pdf.setFont(undefined, "bold");
        pdf.text(
            check.result || "",
            168,
            y
        );

        y += rowHeight + 2;
    });

    y += 5;

    /* -----------------------------
       ISSUES
    ----------------------------- */

    const issues =
        (level.data.issues || []).filter(
            i =>
                i.location ||
                i.contact ||
                i.issue ||
                i.photo
        );

    if (issues.length) {

        pdf.setFontSize(12);
        pdf.setFont(undefined, "bold");
        pdf.setTextColor(180, 0, 0);

        pdf.text(
            "Issues Identified",
            15,
            y
        );

        y += 8;

        issues.forEach(issue => {

            const issueLines =
                pdf.splitTextToSize(
                    issue.issue || "",
                    105
                );

            const detailsHeight =
                25 + (issueLines.length * 5);

            const boxHeight =
                Math.max(
                    detailsHeight,
                    55
                );

            if (y + boxHeight + 10 > 280) {
                pdf.addPage();
                y = 20;
            }

            /* Main issue box */

            pdf.setDrawColor(180);
            pdf.roundedRect(
                10,
                y,
                185,
                boxHeight,
                3,
                3
            );

            /* Photo frame */

            pdf.setDrawColor(120);

            pdf.rect(
                145,
                y + 5,
                40,
                40
            );

            /* Issue title */

            pdf.setFontSize(11);
            pdf.setTextColor(0);
            pdf.setFont(undefined, "bold");

            pdf.text(
                `Issue #${issueCounter}`,
                15,
                y + 8
            );

            /* Details */

            pdf.setFont(undefined, "normal");

            pdf.text(
                `Location: ${issue.location || ""}`,
                15,
                y + 18
            );

            pdf.text(
                `Contact: ${issue.contact || ""}`,
                15,
                y + 26
            );

            pdf.text(
                "Issue:",
                15,
                y + 34
            );

            pdf.text(
                issueLines,
                15,
                y + 40
            );

            /* Photo */

            if (issue.photo) {

                try {

                    let format = "JPEG";

                    if (
                        issue.photo.startsWith(
                            "data:image/png"
                        )
                    ) {
                        format = "PNG";
                    }

                    pdf.addImage(
                        issue.photo,
                        format,
                        146,
                        y + 6,
                        38,
                        38
                    );

                } catch (err) {
                    console.log(err);
                }

            } else {

                pdf.setFontSize(8);

                pdf.text(
                    "NO PHOTO",
                    155,
                    y + 27
                );
            }

            issueCounter++;

            y += boxHeight + 8;
        });
    }

    y += 10;
});
    /* SIGN-OFF */

    pdf.addPage();

    pdf.setFontSize(20);
    pdf.setFont(undefined,"bold");
    pdf.setTextColor(0, 0, 0);

    pdf.text(
        "Audit Approval",
        15,
        25
    );

    pdf.addImage(
        signature,
        "PNG",
        20,
        40,
        90,
        35
    );

    pdf.setFontSize(12);
    pdf.setFont(undefined,"normal");

    pdf.text(
        `Auditor: ${auditor}`,
        20,
        90
    );

    pdf.text(
        `Signed: ${now.toLocaleString()}`,
        20,
        100
    );

    function addFooter(pdf) {
    const pageCount = pdf.getNumberOfPages();

    for (let i = 1; i <= pageCount; i++) {
        pdf.setPage(i);

        pdf.setFontSize(8);
        pdf.setTextColor(100);

        pdf.text(
            `Page ${i} of ${pageCount}`,
            105,
            290,
            { align: "center" }
        );
    }
}

    const auditDate =
        now.getFullYear() +
        "-" +
        String(now.getMonth()+1)
        .padStart(2,"0") +
        "-" +
        String(now.getDate())
        .padStart(2,"0");

    pdf.save(

    localStorage.removeItem("completedAuditPages");

    updateProgress();
    clearSignature();
    closeSignOffModal();

    alert(
        "Professional audit report generated successfully."
    );
}
