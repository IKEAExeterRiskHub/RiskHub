<!DOCTYPE html>

<meta charset="UTF-8">

<title>BR&C Audit Hub</title>

<style>

/* Logo */
.logo {
    position: absolute;
    top: 10px;
    left: 10px;
    height: 60px;
    width: auto;
    z-index: 1000;
}

body {
    margin: 0;
    font-family: Noto IKEA Regular;
    background-color: #0058A3;
    color: white;
    text-align: center;
}

/* Header */
header {
    background-color: #ffdb00;
    color: #0058A3;
    padding: 20px;
    font-size: 32px;
    font-weight: bold;
}

/* Button Container */
.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 40px 20px;
}

/* Buttons */
.btn {
    width: 220px;
    min-height: 70px;
    background-color: #FFDA1A;
    color: #0058A3;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background-color: white;
    transform: translateY(-2px);
}

/* Mobile */
@media (max-width: 768px) {
    .btn {
        width: 90%;
    }
}
</style>

<script>

function resetData() {
    if (confirm("Are you sure you want to clear all stored audit data? This cannot be undone.")) {
        localStorage.clear();
        alert("All stored data has been cleared.");
        location.reload();
    }
}

</script>

</head>


<body>
